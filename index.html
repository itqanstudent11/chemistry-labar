<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><meta name="description" content="مختبر الكيمياء: تعلم الكيمياء بالعربية من الصفر عبر دروس وتحديات ومحاكاة"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>مختبر الكيمياء</title><style>
:root{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;color:#e9f5ff;background:#081726}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#174263,#081726 55%);min-height:100vh}header{padding:20px 18px;background:#102b42d9;border-bottom:1px solid #31536c;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.shell{max-width:920px;margin:auto}h1{font-size:24px;margin:0}h2{font-size:21px}p{line-height:1.9;color:#c9d9e5}.muted{color:#a9c2d3}.pill{display:inline-block;padding:5px 12px;border-radius:20px;background:#174962;color:#9fe7e4;font-size:13px}nav{display:flex;gap:8px;overflow:auto;padding:13px 16px}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:12px 16px;background:#1a405c;color:white}button.active,.primary{background:#19b5ad;color:#05232b;font-weight:750}button:disabled{opacity:.5;cursor:not-allowed}main{padding:12px 16px 70px}.panel{background:#102c43;border:1px solid #294b64;border-radius:20px;padding:19px;margin:14px 0;box-shadow:0 8px 30px #0002}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#143650;border:1px solid #315a70;border-radius:16px;padding:17px}.card h3{margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.meter{height:12px;background:#315067;border-radius:12px;overflow:hidden}.meter>div{height:100%;background:#21c6ad;transition:width .3s}.option{display:block;width:100%;text-align:right;margin:9px 0;background:#1b415d;border:1px solid #47708a}.option.correct{background:#145a4c;border-color:#40d5a4}.option.wrong{background:#683b45;border-color:#ff8c9d}.big{font-size:52px;font-weight:800;color:#62e2cf}.atom{position:relative;width:200px;height:200px;margin:25px auto;display:grid;place-items:center}.nucleus{border-radius:100%;width:66px;height:66px;background:radial-gradient(circle,#ffbd70,#ec5970);display:grid;place-items:center;color:#211625;font-weight:900;z-index:2}.orbit{position:absolute;width:170px;height:65px;border:2px solid #4bd3dc;border-radius:50%;transform:rotate(var(--r))}.orbit:after{content:'●';color:#a3f4ff;position:absolute;top:-13px;left:75px;font-size:24px}.field{width:100%;padding:13px;border-radius:12px;background:#071d2d;color:white;border:1px solid #4c7088;font:inherit}label{display:block;margin:12px 0 5px}.feedback{padding:13px;border-radius:12px;background:#164b55;margin-top:12px}.element{width:85px;min-height:95px;background:#145568;border:1px solid #5dc5b6;border-radius:12px;text-align:center;padding:8px;cursor:pointer}.elements{display:flex;gap:10px;flex-wrap:wrap}.element strong{display:block;font-size:28px}.hidden{display:none}footer{text-align:center;padding:20px;color:#95b2c5;font-size:13px}@media(max-width:460px){h1{font-size:21px}.panel{padding:14px}}
</style></head><body><header><div class="shell row"><div><h1>⚗️ مختبر الكيمياء</h1><span class="muted">من الصفر — بالعربية — مجانًا</span></div><span class="pill" id="points">⭐ 0 نقطة</span></div></header><div class="shell"><nav id="nav"><button data-page="home" class="active">الرئيسية</button><button data-page="lessons">الدروس</button><button data-page="quiz">الاختبارات</button><button data-page="lab">المختبر</button><button data-page="table">العناصر</button><button data-page="tools">الحاسبة</button></nav><main id="app"></main></div><footer>نسخة تأسيسية 1.0 • التقدم محفوظ على جهازك • لا حساب ولا إعلانات</footer><script>
'use strict';
const lessons=[
{title:'ما الكيمياء؟',topic:'الكيمياء علم يدرس المادة وتركيبها وخواصها والتغيرات التي تطرأ عليها. المادة كل ما له كتلة ويشغل حيزًا من الفراغ.',example:'انصهار الثلج تغير فيزيائي، أما احتراق الخشب فتغير كيميائي.',q:'أي مثال يمثل تغيرًا كيميائيًا؟',opts:['ذوبان الثلج','احتراق الخشب','تقطيع الورق'],a:1,why:'الاحتراق ينتج مواد جديدة، لذلك هو تغير كيميائي.'},
{title:'حالات المادة',topic:'توجد المادة عادة في ثلاث حالات: الصلبة لها شكل وحجم ثابتان، والسائلة لها حجم ثابت وتأخذ شكل الوعاء، والغازية ليس لها شكل أو حجم ثابت.',example:'الماء: جليد (صلب)، ماء (سائل)، بخار (غاز).',q:'أي حالة تأخذ شكل الوعاء مع ثبات حجمها تقريبًا؟',opts:['السائلة','الغازية','الصلبة'],a:0,why:'السائل يحتفظ بحجمه تقريبًا لكنه يأخذ شكل الوعاء.'},
{title:'الذرة ومكوناتها',topic:'تتكون الذرة من نواة تضم بروتونات موجبة ونيوترونات متعادلة، وتحيط بها إلكترونات سالبة. في الذرة المتعادلة عدد البروتونات يساوي عدد الإلكترونات.',example:'ذرة الكربون المتعادلة تحتوي 6 بروتونات و6 إلكترونات.',q:'ما الجسيم ذو الشحنة السالبة؟',opts:['البروتون','النيوترون','الإلكترون'],a:2,why:'الإلكترون سالب الشحنة، والبروتون موجب، والنيوترون متعادل.'},
{title:'العدد الذري والكتلي',topic:'العدد الذري Z يساوي عدد البروتونات. العدد الكتلي A يساوي البروتونات + النيوترونات. إذن النيوترونات = A − Z.',example:'الأكسجين-16: عدد ذري 8، وله 8 نيوترونات.',q:'ذرة عددها الكتلي 23 والذري 11؛ كم نيوترونًا؟',opts:['11','12','23'],a:1,why:'23 − 11 = 12 نيوترونًا.'},
{title:'العناصر والمركبات',topic:'العنصر يتكون من نوع واحد من الذرات. المركب يتكون من عنصرين أو أكثر مرتبطين كيميائيًا بنسب محددة. المخلوط يحتوي مواد غير مرتبطة كيميائيًا بالضرورة.',example:'الأكسجين O₂ عنصر، والماء H₂O مركب، والهواء مخلوط.',q:'أي المواد التالية مركب؟',opts:['الحديد Fe','الماء H₂O','الأكسجين O₂'],a:1,why:'الماء يتكون من الهيدروجين والأكسجين المرتبطين كيميائيًا.'},
{title:'الجدول الدوري',topic:'يرتب الجدول الدوري العناصر وفق أعدادها الذرية المتزايدة. الصفوف تسمى دورات، والأعمدة تسمى مجموعات، وتشترك عناصر المجموعة غالبًا في خواص كيميائية متشابهة.',example:'الصوديوم والبوتاسيوم من الفلزات القلوية في المجموعة الأولى.',q:'على أي أساس يرتب الجدول الدوري الحديث؟',opts:['العدد الذري','الكتلة فقط','لون العنصر'],a:0,why:'العناصر مرتبة تصاعديًا حسب عدد البروتونات (العدد الذري).'},
{title:'الأيونات',topic:'الأيون ذرة أو مجموعة ذرات لها شحنة كهربائية بسبب فقد أو اكتساب إلكترونات. فقد الإلكترون ينتج أيونًا موجبًا، واكتسابه ينتج أيونًا سالبًا.',example:'Na⁺ ينتج من فقد الصوديوم إلكترونًا واحدًا.',q:'عند فقد ذرة إلكترونًا تصبح غالبًا:',opts:['سالبة','موجبة','متعادلة دائمًا'],a:1,why:'فقد الشحنة السالبة يجعل الشحنة الكلية موجبة.'},
{title:'الروابط الكيميائية',topic:'الرابطة الأيونية تنشأ من تجاذب الأيونات مختلفة الشحنة، والرابطة التساهمية تنشأ من مشاركة الذرات في أزواج إلكترونية.',example:'كلوريد الصوديوم NaCl أيوني، وجزيء الماء H₂O ذو روابط تساهمية.',q:'ما نوع الروابط داخل جزيء الماء؟',opts:['تساهمية','فلزية','أيونية بحتة'],a:0,why:'تتشارك ذرات الهيدروجين والأكسجين في الإلكترونات.'},
{title:'المعادلات الكيميائية',topic:'تعبر المعادلة الكيميائية عن المتفاعلات والنواتج. يجب موازنتها بحيث يتساوى عدد ذرات كل عنصر في الطرفين وفق قانون حفظ الكتلة.',example:'2H₂ + O₂ → 2H₂O',q:'ما معامل H₂ في المعادلة الموزونة  __H₂ + O₂ → 2H₂O ؟',opts:['1','2','3'],a:1,why:'نحتاج جزيئين H₂ لتوفير أربع ذرات هيدروجين.'},
{title:'المول والكتلة المولية',topic:'المول وحدة لكمية المادة، ويحتوي نحو 6.022×10²³ جسيمًا. عدد المولات = الكتلة بالجرام ÷ الكتلة المولية (جرام/مول).',example:'18 جرامًا من الماء (كتلته المولية ≈18 جرام/مول) تساوي مولًا واحدًا.',q:'كم مولًا في 36 جرامًا من الماء؟',opts:['1','2','3'],a:1,why:'36 ÷ 18 = 2 مول.'},
{title:'الأحماض والقواعد',topic:'الرقم الهيدروجيني pH مقياس للحموضة أو القاعدية. عند 25°C، المحلول ذو pH أقل من 7 حمضي، وأعلى من 7 قاعدي، و7 متعادل تقريبًا.',example:'عصير الليمون حمضي، والماء النقي متعادل تقريبًا عند 25°C.',q:'محلول pH له يساوي 3 هو:',opts:['حمضي','قاعدي','متعادل'],a:0,why:'القيم الأقل من 7 تشير إلى الحموضة في الظروف المعتادة.'},
{title:'مدخل الكيمياء العضوية',topic:'تدرس الكيمياء العضوية مركبات الكربون، وخاصة الهيدروكربونات ومشتقاتها. الألكانات هيدروكربونات مشبعة ذات روابط كربون-كربون أحادية.',example:'الميثان CH₄ أبسط الألكانات.',q:'ما الصيغة الكيميائية للميثان؟',opts:['CH₄','CO₂','H₂O'],a:0,why:'الميثان يتكون من ذرة كربون وأربع ذرات هيدروجين.'}
];
const els=[['H','هيدروجين',1,1.008],['He','هيليوم',2,4.003],['Li','ليثيوم',3,6.94],['Be','بيريليوم',4,9.012],['B','بورون',5,10.81],['C','كربون',6,12.011],['N','نيتروجين',7,14.007],['O','أكسجين',8,15.999],['F','فلور',9,18.998],['Ne','نيون',10,20.18],['Na','صوديوم',11,22.99],['Mg','مغنيسيوم',12,24.305],['Al','ألومنيوم',13,26.982],['Si','سيليكون',14,28.085],['P','فوسفور',15,30.974],['S','كبريت',16,32.06],['Cl','كلور',17,35.45],['Ar','أرجون',18,39.948],['K','بوتاسيوم',19,39.098],['Ca','كالسيوم',20,40.078]];
const key='chem-lab-ar-v1';let saved={done:[],points:0};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){};let current='home',quizIndex=0,answered=false;
function persist(){localStorage.setItem(key,JSON.stringify(saved));document.getElementById('points').textContent='⭐ '+saved.points+' نقطة'}
function render(page=current){current=page;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const app=document.getElementById('app');
if(page==='home'){app.innerHTML=`<section class="panel"><span class="pill">مرحبًا بك في رحلتك العلمية ✨</span><h2>تعلّم الكيمياء خطوة بخطوة</h2><p>12 درسًا تأسيسيًا، أسئلة بتصحيح فوري، مختبر ذرة تفاعلي، وعناصر وحاسبة. ابدأ من الدرس الأول ثم اختبر نفسك.</p><div class="row"><strong>تقدمك: ${saved.done.length} من ${lessons.length} درسًا</strong><strong>${Math.round(saved.done.length/lessons.length*100)}%</strong></div><div class="meter"><div style="width:${saved.done.length/lessons.length*100}%"></div></div><p><button class="primary" onclick="render('lessons')">ابدأ التعلم ←</button></p></section><div class="cards"><div class="card"><h3>📘 الدروس</h3><p>شرح وأمثلة وسؤال بعد كل درس.</p></div><div class="card"><h3>⚛️ المختبر</h3><p>غيّر عدد البروتونات والإلكترونات وشاهد نتيجة التغيير.</p></div><div class="card"><h3>🏆 التحديات</h3><p>اختبارات فورية ونقاط على الإجابات الصحيحة.</p></div></div>`}
if(page==='lessons'){app.innerHTML='<h2>📚 المسار التعليمي</h2><p>ابدأ بالدرس الأول واتبع الترتيب المقترح.</p><div class="cards">'+lessons.map((l,i)=>`<div class="card"><span class="pill">الدرس ${i+1}</span><h3>${l.title}</h3><p>${saved.done.includes(i)?'✅ مكتمل':'📖 لم يكتمل بعد'}</p><button onclick="showLesson(${i})">افتح الدرس</button></div>`).join('')+'</div>'}
if(page==='quiz'){quizIndex=0;answered=false;showQuiz()}
if(page==='lab'){app.innerHTML=`<h2>⚛️ مختبر بناء الذرة</h2><div class="panel"><p>غيّر عدد البروتونات والنيوترونات والإلكترونات. يحدد عدد البروتونات هوية العنصر، وتحدد الإلكترونات الشحنة.</p><label>البروتونات: <b id="pc">1</b></label><input class="field" id="p" type="range" min="1" max="20" value="1" oninput="updateAtom()"><label>النيوترونات: <b id="nc">0</b></label><input class="field" id="n" type="range" min="0" max="25" value="0" oninput="updateAtom()"><label>الإلكترونات: <b id="ec">1</b></label><input class="field" id="e" type="range" min="0" max="20" value="1" oninput="updateAtom()"><div class="atom"><div class="orbit" style="--r:0deg"></div><div class="orbit" style="--r:60deg"></div><div class="orbit" style="--r:120deg"></div><div class="nucleus" id="atomSymbol">H</div></div><div class="feedback" id="atomInfo"></div><p class="muted">الرسم تخطيطي تعليمي وليس تمثيلًا دقيقًا للمدارات الكمومية.</p></div>`;updateAtom()}
if(page==='table'){app.innerHTML='<h2>🧬 أول 20 عنصرًا</h2><p>اضغط على أي عنصر لمعرفة عدده الذري وكتلته الذرية التقريبية.</p><div class="panel"><div class="elements">'+els.map((e,i)=>`<button class="element" onclick="showElement(${i})"><small>${e[2]}</small><strong>${e[0]}</strong><small>${e[1]}</small></button>`).join('')+'</div><div class="feedback" id="elementInfo">اختر عنصرًا من الأعلى.</div></div>'}
if(page==='tools'){app.innerHTML=`<h2>🧮 حاسبة المول</h2><div class="panel"><p>عدد المولات = الكتلة (جرام) ÷ الكتلة المولية (جرام/مول)</p><label>كتلة العينة بالجرام</label><input class="field" id="mass" type="number" min="0" step="any" value="36"><label>الكتلة المولية (جرام/مول)</label><input class="field" id="molar" type="number" min="0.000001" step="any" value="18"><p><button class="primary" onclick="calculate()">احسب عدد المولات</button></p><div class="feedback" id="calcResult">مثال: 36 جرام ماء ÷ 18 جرام/مول = 2 مول.</div></div>`}}
function showLesson(i){const l=lessons[i];document.getElementById('app').innerHTML=`<button onclick="render('lessons')">→ العودة للدروس</button><article class="panel"><span class="pill">الدرس ${i+1} من ${lessons.length}</span><h2>${l.title}</h2><p>${l.topic}</p><div class="feedback"><strong>مثال توضيحي:</strong><p>${l.example}</p></div><h3>✍️ اختبر فهمك</h3><p>${l.q}</p><div id="answers">${l.opts.map((o,j)=>`<button class="option" onclick="answerLesson(${i},${j})">${o}</button>`).join('')}</div><div id="lessonResult"></div></article>`}
function answerLesson(i,j){const l=lessons[i],correct=j===l.a;document.querySelectorAll('#answers button').forEach((b,k)=>{b.disabled=true;b.classList.add(k===l.a?'correct':k===j?'wrong':'')});document.getElementById('lessonResult').innerHTML=`<div class="feedback">${correct?'✅ إجابة صحيحة!':'❌ ليست الإجابة الصحيحة.'} ${l.why}</div><p><button class="primary" onclick="${i+1<lessons.length?`showLesson(${i+1})`:`render('lessons')`}">${i+1<lessons.length?'الدرس التالي':'العودة للدروس'}</button></p>`;if(correct&&!saved.done.includes(i)){saved.done.push(i);saved.points+=10;persist()}}
function showQuiz(){const l=lessons[quizIndex];document.getElementById('app').innerHTML=`<h2>🏆 تحدي المعرفة</h2><div class="panel"><span class="pill">السؤال ${quizIndex+1} من ${lessons.length}</span><h3>${l.q}</h3><div id="answers">${l.opts.map((o,j)=>`<button class="option" onclick="answerQuiz(${j})">${o}</button>`).join('')}</div><div id="quizResult"></div></div>`}
function answerQuiz(j){if(answered)return;answered=true;const l=lessons[quizIndex],correct=j===l.a;document.querySelectorAll('#answers button').forEach((b,k)=>{b.disabled=true;b.classList.add(k===l.a?'correct':k===j?'wrong':'')});if(correct){saved.points+=2;persist()}document.getElementById('quizResult').innerHTML=`<div class="feedback">${correct?'🎉 صحيح!':'💡 حاول تذكر هذه المعلومة.'} ${l.why}</div><p><button class="primary" onclick="nextQuiz()">${quizIndex+1<lessons.length?'السؤال التالي':'إنهاء الاختبار'}</button></p>`}
function nextQuiz(){answered=false;if(++quizIndex>=lessons.length){document.getElementById('app').innerHTML='<div class="panel"><h2>🎊 أحسنت! أنهيت التحدي</h2><p>يمكنك إعادة الاختبار لتثبيت معلوماتك.</p><button class="primary" onclick="render(\'quiz\')">أعد التحدي</button></div>'}else showQuiz()}
function updateAtom(){let p=+document.getElementById('p').value,n=+document.getElementById('n').value,e=+document.getElementById('e').value;document.getElementById('pc').textContent=p;document.getElementById('nc').textContent=n;document.getElementById('ec').textContent=e;document.getElementById('atomSymbol').textContent=els[p-1][0];document.getElementById('atomInfo').innerHTML=`<strong>${els[p-1][1]} (${els[p-1][0]})</strong><p>العدد الذري: ${p} | العدد الكتلي: ${p+n} | الشحنة: ${p-e>0?'+'+(p-e):p-e} | ${p===e?'ذرة متعادلة':p>e?'أيون موجب':'أيون سالب'}</p>`}
function showElement(i){let e=els[i];document.getElementById('elementInfo').textContent=`${e[1]} (${e[0]}) — العدد الذري: ${e[2]} — الكتلة الذرية التقريبية: ${e[3]} وحدة كتلة ذرية.`}
function calculate(){let m=+document.getElementById('mass').value,mm=+document.getElementById('molar').value;document.getElementById('calcResult').textContent=!Number.isFinite(m)||!Number.isFinite(mm)||m<0||mm<=0?'أدخل كتلة غير سالبة وكتلة مولية أكبر من صفر.':`عدد المولات = ${(m/mm).toLocaleString('ar',{maximumFractionDigits:6})} مول`}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));persist();render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
